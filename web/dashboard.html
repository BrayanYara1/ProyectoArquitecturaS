<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Paciente - Salud Activa</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fa-solid fa-heart-pulse me-2"></i>Salud Activa Web
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item me-3 text-white">
                        <i class="fa-solid fa-circle-user me-1"></i> <span id="userNameDisplay">Paciente</span>
                    </li>
                    <li class="nav-item">
                        <button id="btnLogout" class="btn btn-outline-light btn-sm">
                            <i class="fa-solid fa-right-from-bracket me-1"></i> Cerrar Sesión
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container my-4">
        <!-- ALERTAS -->
        <div id="dashAlertContainer"></div>

        <div class="row">
            <!-- NAVEGACIÓN LATERAL / PESTAÑAS -->
            <div class="col-lg-3 mb-4">
                <div class="card custom-card p-3">
                    <div class="nav flex-column nav-pills" id="v-pills-tab" role="tablist">
                        <button class="nav-link active text-start mb-2" id="tab-turnos" data-bs-toggle="pill" data-bs-target="#pills-turnos" type="button">
                            <i class="fa-solid fa-calendar-check me-2"></i> Mis Turnos
                        </button>
                        <button class="nav-link text-start mb-2" id="tab-solicitar" data-bs-toggle="pill" data-bs-target="#pills-solicitar" type="button">
                            <i class="fa-solid fa-calendar-plus me-2"></i> Solicitar Turno
                        </button>
                        <button class="nav-link text-start mb-2" id="tab-medicamentos" data-bs-toggle="pill" data-bs-target="#pills-medicamentos" type="button">
                            <i class="fa-solid fa-pills me-2"></i> Medicamentos
                        </button>
                        <button class="nav-link text-start mb-2" id="tab-estudios" data-bs-toggle="pill" data-bs-target="#pills-estudios" type="button">
                            <i class="fa-solid fa-file-medical me-2"></i> Estudios Médicos
                        </button>
                        <button class="nav-link text-start mb-2" id="tab-chat" data-bs-toggle="pill" data-bs-target="#pills-chat" type="button">
                            <i class="fa-solid fa-comments me-2"></i> Chat Consultas
                        </button>
                    </div>
                </div>
            </div>

            <!-- CONTENIDO DE LAS PESTAÑAS -->
            <div class="col-lg-9">
                <div class="tab-content" id="v-pills-tabContent">

                    <!-- PESTAÑA: MIS TURNOS -->
                    <div class="tab-pane fade show active" id="pills-turnos" role="tabpanel">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="mb-0"><i class="fa-solid fa-calendar-days text-primary me-2"></i>Mis Turnos Médicos</h4>
                            <button class="btn btn-primary btn-sm" onclick="cargarTurnos()">
                                <i class="fa-solid fa-rotate-right me-1"></i> Actualizar
                            </button>
                        </div>
                        <div id="turnosListContainer" class="row g-3">
                            <div class="col-12 text-center py-4 text-muted">Cargando turnos...</div>
                        </div>
                    </div>

                    <!-- PESTAÑA: SOLICITAR TURNO -->
                    <div class="tab-pane fade" id="pills-solicitar" role="tabpanel">
                        <div class="card custom-card p-4">
                            <h4 class="mb-3 text-primary"><i class="fa-solid fa-calendar-plus me-2"></i>Reservar Nuevo Turno</h4>
                            <form id="formSolicitarTurno">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="selectEspecialidad" class="form-label">Especialidad</label>
                                        <select class="form-select" id="selectEspecialidad" required>
                                            <option value="">Cargando especialidades...</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="inputMedico" class="form-label">Médico o Profesional</label>
                                        <input type="text" class="form-control" id="inputMedico" placeholder="Ej. Dr. Carlos Rodríguez" required>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="inputFecha" class="form-label">Fecha</label>
                                        <input type="date" class="form-control" id="inputFecha" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="inputHora" class="form-label">Hora</label>
                                        <input type="time" class="form-control" id="inputHora" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="inputMotivo" class="form-label">Motivo de Consulta</label>
                                    <textarea class="form-control" id="inputMotivo" rows="2" placeholder="Ej. Chequeo de rutina"></textarea>
                                </div>
                                <button type="submit" class="btn btn-success w-100 py-2">
                                    <i class="fa-solid fa-check-circle me-2"></i>Confirmar Reserva
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- PESTAÑA: MEDICAMENTOS -->
                    <div class="tab-pane fade" id="pills-medicamentos" role="tabpanel">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="mb-0"><i class="fa-solid fa-pills text-primary me-2"></i>Mis Medicamentos</h4>
                            <button class="btn btn-outline-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalNuevoMedicamento">
                                <i class="fa-solid fa-plus me-1"></i> Agregar Medicamento
                            </button>
                        </div>
                        <div id="medicamentosListContainer" class="row g-3">
                            <div class="col-12 text-center py-4 text-muted">Cargando medicamentos...</div>
                        </div>
                    </div>

                    <!-- PESTAÑA: ESTUDIOS -->
                    <div class="tab-pane fade" id="pills-estudios" role="tabpanel">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="mb-0"><i class="fa-solid fa-file-medical text-primary me-2"></i>Estudios Médicos</h4>
                            <button class="btn btn-outline-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalNuevoEstudio">
                                <i class="fa-solid fa-upload me-1"></i> Registrar Estudio
                            </button>
                        </div>
                        <div id="estudiosListContainer" class="row g-3">
                            <div class="col-12 text-center py-4 text-muted">Cargando estudios...</div>
                        </div>
                    </div>

                    <!-- PESTAÑA: CHAT -->
                    <div class="tab-pane fade" id="pills-chat" role="tabpanel">
                        <div class="card custom-card p-3">
                            <h4 class="mb-3"><i class="fa-solid fa-comments text-primary me-2"></i>Chat y Consultas</h4>
                            <div id="chatMessages" class="chat-box mb-3">
                                <div class="text-center text-muted py-5">Inicia una conversación enviando un mensaje.</div>
                            </div>
                            <form id="formChat" class="d-flex gap-2">
                                <input type="text" id="inputChatMsg" class="form-control" placeholder="Escribe tu mensaje..." required>
                                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i></button>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- MODAL NUEVO MEDICAMENTO -->
    <div class="modal fade" id="modalNuevoMedicamento" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fa-solid fa-capsules me-2"></i>Agregar Medicamento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="formNuevoMedicamento">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Nombre del Medicamento</label>
                            <input type="text" id="medNombre" class="form-control" placeholder="Ej. Paracetamol" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Dosis</label>
                            <input type="text" id="medDosis" class="form-control" placeholder="Ej. 500 mg" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Frecuencia / Horario</label>
                            <input type="text" id="medHorario" class="form-control" placeholder="Ej. Cada 8 horas" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL NUEVO ESTUDIO -->
    <div class="modal fade" id="modalNuevoEstudio" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fa-solid fa-file-waveform me-2"></i>Registrar Estudio Médico</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="formNuevoEstudio">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Título del Estudio</label>
                            <input type="text" id="estudioTitulo" class="form-control" placeholder="Ej. Análisis de Sangre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Laboratorio / Centro</label>
                            <input type="text" id="estudioLab" class="form-control" placeholder="Ej. Laboratorio Central">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Fecha</label>
                            <input type="date" id="estudioFecha" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción o Resultado</label>
                            <textarea id="estudioDesc" class="form-control" rows="2"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Estudio</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom App JS -->
    <script src="js/app.js"></script>
</body>
</html>
