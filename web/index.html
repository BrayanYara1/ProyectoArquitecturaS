<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salud Activa - Portal de Turnos y Pacientes</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <div class="container">
        <div class="auth-container">
            <div class="brand-header">
                <i class="fa-solid fa-heart-pulse fa-3x text-primary mb-2"></i>
                <h2>Salud Activa</h2>
                <p class="text-muted">Portal Web de Gestión Médica</p>
            </div>

            <!-- Alertas de Error / Éxito -->
            <div id="alertContainer"></div>

            <!-- Tabs de Login / Registro -->
            <ul class="nav nav-tabs nav-justified mb-4" id="authTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-panel" type="button" role="tab">
                        Iniciar Sesión
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-panel" type="button" role="tab">
                        Registrarse
                    </button>
                </li>
            </ul>

            <div class="tab-content" id="authTabsContent">
                <!-- FORMULARIO DE LOGIN -->
                <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">Correo Electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                                <input type="email" class="form-control" id="loginEmail" placeholder="usuario@correo.com" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="loginPassword" class="form-label">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">
                            <i class="fa-solid fa-right-to-bracket me-2"></i>Ingresar
                        </button>
                    </form>
                </div>

                <!-- FORMULARIO DE REGISTRO -->
                <div class="tab-pane fade" id="register-panel" role="tabpanel">
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="regNombre" class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" id="regNombre" placeholder="Juan Pérez" required>
                        </div>
                        <div class="mb-3">
                            <label for="regEmail" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="regEmail" placeholder="usuario@correo.com" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="regDni" class="form-label">DNI / Identificación</label>
                                <input type="text" class="form-control" id="regDni" placeholder="12345678" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="regTelefono" class="form-label">Teléfono</label>
                                <input type="tel" class="form-control" id="regTelefono" placeholder="1122334455">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="regPassword" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="regPassword" placeholder="••••••••" required minlength="6">
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2">
                            <i class="fa-solid fa-user-plus me-2"></i>Crear Cuenta
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom App JS -->
    <script src="js/app.js"></script>
</body>
</html>
