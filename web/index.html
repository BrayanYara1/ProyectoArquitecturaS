<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salud Activa - Portal Web de Pacientes</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="text-center mb-4">
                <div class="brand-icon">
                    <i class="fa-solid fa-heart-pulse"></i>
                </div>
                <h3 class="fw-bold mb-1">Salud Activa</h3>
                <p class="text-secondary small">Portal Médico Digital de Pacientes</p>
            </div>

            <!-- ALERTAS -->
            <div id="alertContainer"></div>

            <!-- TABS LOGIN / REGISTRO -->
            <ul class="nav auth-nav nav-justified mb-4" id="authTabs" role="tablist">
                <li class="nav-item">
                    <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-panel" type="button">
                        Iniciar Sesión
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-panel" type="button">
                        Crear Cuenta
                    </button>
                </li>
            </ul>

            <div class="tab-content" id="authTabsContent">
                <!-- LOGIN -->
                <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label small fw-bold">Correo Electrónico</label>
                            <input type="email" class="form-control form-control-custom" id="loginEmail" placeholder="ejemplo@correo.com" required>
                        </div>
                        <div class="mb-4">
                            <label for="loginPassword" class="form-label small fw-bold">Contraseña</label>
                            <input type="password" class="form-control form-control-custom" id="loginPassword" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary-gradient w-100 py-3">
                            <i class="fa-solid fa-right-to-bracket me-2"></i>Ingresar al Portal
                        </button>
                    </form>
                </div>

                <!-- REGISTRO -->
                <div class="tab-pane fade" id="register-panel" role="tabpanel">
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="regNombre" class="form-label small fw-bold">Nombre Completo</label>
                            <input type="text" class="form-control form-control-custom" id="regNombre" placeholder="Juan Pérez" required>
                        </div>
                        <div class="mb-3">
                            <label for="regEmail" class="form-label small fw-bold">Correo Electrónico</label>
                            <input type="email" class="form-control form-control-custom" id="regEmail" placeholder="ejemplo@correo.com" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="regDni" class="form-label small fw-bold">DNI / ID</label>
                                <input type="text" class="form-control form-control-custom" id="regDni" placeholder="12345678" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="regTelefono" class="form-label small fw-bold">Teléfono</label>
                                <input type="tel" class="form-control form-control-custom" id="regTelefono" placeholder="1122334455">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="regPassword" class="form-label small fw-bold">Contraseña</label>
                            <input type="password" class="form-control form-control-custom" id="regPassword" placeholder="••••••••" required minlength="6">
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-3 fw-bold rounded-3" style="background: var(--success-gradient); border:none">
                            <i class="fa-solid fa-user-plus me-2"></i>Registrarse
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
